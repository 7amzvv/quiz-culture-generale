<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz de culture générale</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main>
        <h1>Quiz de culture générale</h1>
        <form id="quiz-form">
            <p class="quiz-rules">Tu as 10 secondes par question pour choisir et valider une réponse.</p>
            <label for="language">Langue des questions</label>
            <select id="language" name="language">
                <option value="fr" selected>Français</option>
                <option value="en">Anglais</option>
            </select>
            <label for="category">Catégorie</label>
            <select id="category" name="category">
                <option value="9">Culture générale</option>
                <option value="17">Sciences</option>
                <option value="22">Géographie</option>
            </select>
            <button type="submit">Commencer</button>
        </form>
        <p id="quiz-status" role="status"></p>
        <section id="question-panel" aria-labelledby="question-title" hidden>
            <div class="question-meta">
                <p id="progress"></p>
                <p role="timer">Temps restant <strong id="time-left">10 s</strong></p>
            </div>
            <h2 id="question-title" tabindex="-1"></h2>
            <ul id="answers"></ul>
            <button id="next-question" type="button" hidden>Suivant</button>
        </section>
        <section id="result-panel" aria-labelledby="score-title" hidden>
            <h2 id="score-title" tabindex="-1"></h2>
            <h3>Corrections</h3>
            <ol id="corrections"></ol>
            <button id="replay" type="button">Rejouer</button>
        </section>
        <footer>
            <a href="https://quizzapi.jomoreschi.fr/">Quiz API v2 - Jonathan Moreschi</a>
            · <a href="https://opentdb.com/">Open Trivia DB</a>
        </footer>
    </main>
</body>
</html>
